<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pemilihan Ketua OSIS</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mut:#667089;--pri:#2457d6;--prt:#fff;--ok:#12805c;--err:#c0392b;--bd:#dde2ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#10141d;--card:#1a2030;--tx:#e8ecf6;--mut:#97a1ba;--pri:#6b94ff;--prt:#0b1020;--ok:#3ccf9b;--err:#ff7a6b;--bd:#2c3550;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:960px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:1.25rem;margin:0}h2{font-size:1.1rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.8rem;border:1px solid var(--bd);color:var(--mut)}
.chip.on{color:var(--ok);border-color:var(--ok)}.chip.off{color:var(--err);border-color:var(--err)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
button{padding:11px 18px;border-radius:10px;border:1px solid var(--bd);background:var(--card);cursor:pointer;min-height:44px}
button.p{background:var(--pri);color:var(--prt);border-color:var(--pri);font-weight:600}
button.d{color:var(--err)}button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row>*{flex:1 1 140px}.row>button{flex:0 0 auto}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}.tabs button{flex:0 0 auto}.tabs .a{background:var(--pri);color:var(--prt);border-color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.cand{text-align:left;padding:18px;border-width:2px;height:100%}.cand.s{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,var(--card))}
.no{font-size:2.4rem;font-weight:800;color:var(--pri);line-height:1}
.mut{color:var(--mut);font-size:.9rem}.err{color:var(--err)}.ok{color:var(--ok)}
.bar{height:22px;border-radius:8px;background:var(--bg);border:1px solid var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat b{display:block;font-size:1.8rem}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.92rem}td,th{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left}
.c{text-align:center}.big{font-size:1.1rem}
</style>
</head>
<body>
<div class="w"><div id="app"></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInAnonymously,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,updateDoc,deleteDoc,onSnapshot,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== ISI DENGAN KONFIGURASI FIREBASE ANDA (lihat README.md) ====== */
const CFG={apiKey:"AIzaSyD-6bziU2pvc7HKzN_enmqTFGr92N8mO90",authDomain:"pemilu-osis-spenaka.firebaseapp.com",projectId:"pemilu-osis-spenaka",appId:"1:727213622696:web:cc4db7cecfba62f1d0499d"};
/* ==================================================================== */

const GROUPS=[];['7','8','9'].forEach(g=>'ABCDEFG'.split('').forEach(c=>GROUPS.push(g+c)));GROUPS.push('Guru','Karyawan');
const S={voters:{},candidates:{},votes:{},open:false,ready:false};
let admin=false,view='vote',tab='live',V={stage:'login'},q='',armed=false,note='',fatal='',loginMsg='',unsubs=[],pub=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean=s=>String(s||'').trim().replace(/[^\w.-]/g,'');
const configured=!CFG.apiKey.startsWith('ISI');
let auth,db;

if(configured){
  const app=initializeApp(CFG);auth=getAuth(app);db=getFirestore(app);
  onAuthStateChanged(auth,async u=>{
    if(!u){admin=false;view='vote';stopAdmin();try{await signInAnonymously(auth)}catch(e){fatal='Gagal terhubung ke Firebase. Periksa konfigurasi dan pengaturan Authentication.';S.ready=true;render(true)}return}
    if(!pub){pub=true;
      onSnapshot(collection(db,'candidates'),s=>{const o={};s.forEach(x=>o[x.id]=x.data());S.candidates=o;render()},()=>{});
      onSnapshot(doc(db,'settings','election'),s=>{const x=s.data();S.open=!!(x&&x.open);render()},()=>{});
    }
    if(u.isAnonymous){admin=false;stopAdmin();if(view==='admin'||view==='login')view='vote'}
    else{admin=true;startAdmin()}
    S.ready=true;render(true);
  });
}else{S.ready=true}
render(true);

function startAdmin(){
  if(unsubs.length)return;
  const bad=()=>{note='Akun ini bukan admin pemilihan.'; render(true)};
  unsubs=[
    onSnapshot(collection(db,'voters'),s=>{const o={};s.forEach(x=>o[x.id]=x.data());S.voters=o;render()},bad),
    onSnapshot(collection(db,'votes'),s=>{const o={};s.forEach(x=>o[x.id]=x.data());S.votes=o;render()},()=>{})
  ];
}
function stopAdmin(){unsubs.forEach(f=>f());unsubs=[];S.voters={};S.votes={}}

/* ---------- voter flow ---------- */
async function doLogin(){
  const id=clean($('nid').value);
  const m=t=>{V.msg=t;render(true)};
  if(!id)return m('Masukkan NISN / ID.');
  if(!S.open)return m('Pemilihan belum dibuka atau sudah ditutup.');
  try{
    const s=await getDoc(doc(db,'voters',id));
    if(!s.exists())return m('Nomor tidak terdaftar. Silakan lapor ke panitia.');
    const v=s.data();
    if(v.voted)return m('Nomor ini sudah menggunakan hak pilih.');
    V={stage:'ballot',id,name:v.name,group:v.group,sel:null};render(true);
  }catch(e){m('Gagal memeriksa data. Periksa koneksi internet.')}
}
async function submitVote(){
  if(!V.sel||V.busy||!S.open)return;
  V.busy=true;render(true);
  try{
    const b=writeBatch(db);
    b.set(doc(collection(db,'votes')),{c:V.sel,t:Date.now()});
    b.update(doc(db,'voters',V.id),{voted:true,at:Date.now()});
    await b.commit();
    V={stage:'done'};render(true);setTimeout(()=>{V={stage:'login'};render(true)},6000);
  }catch(e){V.busy=false;V.msg='Suara gagal disimpan (mungkin nomor ini sudah memilih atau pemilihan ditutup). Hubungi panitia.';render(true)}
}

/* ---------- admin ---------- */
async function adminLogin(){
  try{await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value);view='admin';loginMsg=''}
  catch(e){loginMsg='Email atau password salah.'}render(true);
}
async function logout(){await signOut(auth)}
async function addVoter(){
  const id=clean($('vid').value),nm=$('vnm').value.trim(),g=$('vg').value;
  if(!id||!nm){note='ID/NISN dan nama wajib diisi.';return render(true)}
  if(S.voters[id]){note='ID '+id+' sudah ada di daftar.';return render(true)}
  await setDoc(doc(db,'voters',id),{name:nm,group:g,voted:false});note='Pemilih '+nm+' ditambahkan.';render(true);
}
async function bulkAdd(){
  const rows=$('bulk').value.split('\n').map(l=>l.split(/[,;\t]/).map(x=>x.trim())).filter(r=>r[0]&&r[1]);
  let n=0,skip=0,b=writeBatch(db),c=0;
  for(const r of rows){
    const id=clean(r[0]);if(!id||S.voters[id]){skip++;continue}
    const g=GROUPS.find(x=>x.toLowerCase()===(r[2]||'').toLowerCase())||r[2]||'-';
    b.set(doc(db,'voters',id),{name:r[1],group:g,voted:false});n++;c++;
    if(c>=400){await b.commit();b=writeBatch(db);c=0}
  }
  if(c)await b.commit();
  note=n+' pemilih ditambahkan, '+skip+' dilewati (duplikat/kosong).';render(true);
}
async function addCand(){
  const no=$('cno').value.trim(),nm=$('cnm').value.trim(),vs=$('cvs').value.trim();
  if(!no||!nm){note='Nomor urut dan nama wajib diisi.';return render(true)}
  await setDoc(doc(db,'candidates','c'+clean(no)),{no:+no||0,name:nm,vision:vs});render(true);
}
async function setOpen(b){await setDoc(doc(db,'settings','election'),{open:b})}
async function delDoc(col,id){await deleteDoc(doc(db,col,id))}
async function resetAll(){
  if(!armed){armed=true;render(true);return}
  armed=false;
  const ops=[...Object.keys(S.votes).map(id=>[0,'votes',id]),...Object.keys(S.voters).filter(id=>S.voters[id].voted).map(id=>[1,'voters',id])];
  for(let i=0;i<ops.length;i+=400){
    const b=writeBatch(db);
    ops.slice(i,i+400).forEach(([k,col,id])=>k?b.update(doc(db,col,id),{voted:false,at:null}):b.delete(doc(db,col,id)));
    await b.commit();
  }
  note='Semua suara dan status memilih direset.';render(true);
}
function tally(){const t={};Object.values(S.votes).forEach(v=>t[v.c]=(t[v.c]||0)+1);return t}
function exportCsv(){
  const t=tally(),L=['Hasil,No,Nama,Suara'];
  Object.entries(S.candidates).sort((a,b)=>a[1].no-b[1].no).forEach(([id,c])=>L.push(['Kandidat',c.no,'"'+c.name+'"',t[id]||0].join(',')));
  L.push('','Kelompok,Terdaftar,Sudah memilih');
  GROUPS.forEach(g=>{const a=Object.values(S.voters).filter(v=>v.group===g);L.push([g,a.length,a.filter(v=>v.voted).length].join(','))});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.join('\n')],{type:'text/csv'}));a.download='hasil-osis.csv';a.click();
}

/* ---------- views ---------- */
function render(force){
  const a=document.activeElement;
  if(!force&&a&&$('app').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
  if(!configured){$('app').innerHTML='<div class="card"><h2>Belum dikonfigurasi</h2><p>Isi konfigurasi Firebase di <code>index.html</code> (lihat README.md).</p></div>';return}
  const open=S.open?'<span class="chip on">Pemilihan DIBUKA</span>':'<span class="chip off">Pemilihan DITUTUP</span>';
  const btn=admin?`<button onclick="tog()">${view==='admin'?'Layar Pemilih':'Admin'}</button><button onclick="logout()">Keluar</button>`:`<button onclick="view='login';render(true)">Login Admin</button>`;
  $('app').innerHTML=`<header><h1>Pemilihan Ketua OSIS</h1><div class="row" style="flex:0 1 auto">${open}${btn}</div></header>`
    +(fatal?`<div class="card err">${esc(fatal)}</div>`:!S.ready?'<div class="card">Memuat...</div>':view==='login'&&!admin?loginView():view==='admin'&&admin?adminView():voteView());
}
function tog(){view=view==='admin'?'vote':'admin';render(true)}
function loginView(){return `<div class="card"><h2>Login admin</h2><div class="row"><input id="em" type="email" placeholder="Email admin" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')adminLogin()"><button class="p" onclick="adminLogin()">Masuk</button></div><p class="err">${esc(loginMsg)}</p><button onclick="view='vote';render(true)">Kembali</button></div>`}
function voteView(){
  if(V.stage==='done')return `<div class="card c"><div class="no ok">✓</div><h2 class="big">Terima kasih, suara Anda telah tercatat.</h2><p class="mut">Layar akan kembali otomatis untuk pemilih berikutnya.</p></div>`;
  if(V.stage==='ballot'){
    const cs=Object.entries(S.candidates).sort((a,b)=>a[1].no-b[1].no);
    return `<div class="card"><h2>Halo, ${esc(V.name)} <span class="mut">(${esc(V.group)})</span></h2><p class="mut">Pilih salah satu kandidat, lalu tekan Kirim Suara.</p></div>
    <div class="grid">${cs.map(([id,c])=>`<button class="cand ${V.sel===id?'s':''}" onclick="pick('${id}')"><div class="no">${esc(c.no)}</div><b class="big">${esc(c.name)}</b><div class="mut">${esc(c.vision)}</div></button>`).join('')||'<div class="card">Belum ada kandidat.</div>'}</div>
    <div class="card row" style="margin-top:14px"><span>${V.sel&&S.candidates[V.sel]?'Pilihan: No '+esc(S.candidates[V.sel].no)+' – '+esc(S.candidates[V.sel].name):'Belum memilih'}</span><button onclick="cancelV()">Batal</button><button class="p" ${V.sel&&!V.busy?'':'disabled'} onclick="submitVote()">${V.busy?'Menyimpan...':'Kirim Suara'}</button></div>
    ${V.msg?`<p class="err">${esc(V.msg)}</p>`:''}`;
  }
  return `<div class="card"><h2>Masuk untuk memilih</h2><p class="mut">Masukkan NISN (siswa) atau NIP/ID (guru &amp; karyawan).</p>
    <div class="row"><input id="nid" inputmode="numeric" autocomplete="off" placeholder="NISN / ID" onkeydown="if(event.key==='Enter')doLogin()"><button class="p" onclick="doLogin()">Masuk</button></div>
    ${V.msg?`<p class="err">${esc(V.msg)}</p>`:''}</div>`;
}
function adminView(){
  const T=[['live','Live'],['voters','Pemilih'],['cands','Kandidat'],['ctrl','Kontrol']];
  return `<div class="tabs">${T.map(t=>`<button class="${tab===t[0]?'a':''}" onclick="tab='${t[0]}';note='';render(true)">${t[1]}</button>`).join('')}</div>`
   +(note?`<p class="ok">${esc(note)}</p>`:'')+({live:liveTab,voters:votersTab,cands:candsTab,ctrl:ctrlTab}[tab])();
}
function liveTab(){
  const vs=Object.values(S.voters),done=vs.filter(v=>v.voted).length,t=tally(),total=Object.keys(S.votes).length,mx=Math.max(1,...Object.values(t));
  const cs=Object.entries(S.candidates).sort((a,b)=>a[1].no-b[1].no);
  return `<div class="stats card"><div class="stat"><span class="mut">Terdaftar</span><b>${vs.length}</b></div><div class="stat"><span class="mut">Sudah memilih</span><b>${done}</b></div><div class="stat"><span class="mut">Belum memilih</span><b>${vs.length-done}</b></div><div class="stat"><span class="mut">Partisipasi</span><b>${vs.length?Math.round(done/vs.length*100):0}%</b></div></div>
  <div class="card"><h2>Perolehan suara (live)</h2>${cs.map(([id,c])=>{const n=t[id]||0;return `<div style="margin-bottom:12px"><div class="row" style="flex-wrap:nowrap"><b style="flex:1">No ${esc(c.no)} – ${esc(c.name)}</b><b style="flex:0 0 auto">${n} suara (${total?Math.round(n/total*100):0}%)</b></div><div class="bar"><i style="width:${n/mx*100}%"></i></div></div>`}).join('')||'<span class="mut">Belum ada kandidat.</span>'}</div>
  <div class="card"><h2>Partisipasi per kelas</h2><div class="tw"><table><tr><th>Kelompok</th><th class="c">Terdaftar</th><th class="c">Memilih</th><th class="c">%</th></tr>${GROUPS.map(g=>{const a=vs.filter(v=>v.group===g),d=a.filter(v=>v.voted).length;return `<tr><td>${g}</td><td class="c">${a.length}</td><td class="c">${d}</td><td class="c">${a.length?Math.round(d/a.length*100):0}%</td></tr>`}).join('')}</table></div></div>`;
}
function votersTab(){
  const ql=q.toLowerCase(),all=Object.entries(S.voters).filter(([id,v])=>!ql||id.toLowerCase().includes(ql)||String(v.name).toLowerCase().includes(ql)||String(v.group).toLowerCase()===ql);
  return `<div class="card"><h2>Tambah pemilih yang belum terdaftar</h2><div class="row"><input id="vid" placeholder="NISN / ID"><input id="vnm" placeholder="Nama lengkap"><select id="vg">${GROUPS.map(g=>`<option>${g}</option>`).join('')}</select><button class="p" onclick="addVoter()">Tambah</button></div></div>
  <div class="card"><h2>Impor banyak sekaligus</h2><p class="mut">Satu baris per orang: NISN, Nama, Kelas (contoh: 0012345678, Budi Santoso, 7A). Bisa tempel dari Excel.</p><textarea id="bulk" rows="4"></textarea><div style="margin-top:8px"><button class="p" onclick="bulkAdd()">Impor</button></div></div>
  <div class="card"><h2>Daftar pemilih (${all.length})</h2><input id="qs" placeholder="Cari NISN, nama, atau kelas" value="${esc(q)}" oninput="q=this.value;clearTimeout(window._t);window._t=setTimeout(()=>render(true),250)" style="margin-bottom:10px"><div class="tw"><table><tr><th>ID</th><th>Nama</th><th>Kelas</th><th>Status</th><th></th></tr>${all.slice(0,80).map(([id,v])=>`<tr><td>${esc(id)}</td><td>${esc(v.name)}</td><td>${esc(v.group)}</td><td>${v.voted?'<span class="ok">Sudah</span>':'<span class="mut">Belum</span>'}</td><td>${v.voted?'':`<button class="d" onclick="delDoc('voters','${esc(id)}')">Hapus</button>`}</td></tr>`).join('')}</table></div>${all.length>80?'<p class="mut">Menampilkan 80 pertama, gunakan pencarian.</p>':''}</div>`;
}
function candsTab(){
  const cs=Object.entries(S.candidates).sort((a,b)=>a[1].no-b[1].no);
  return `<div class="card"><h2>Tambah kandidat</h2><div class="row"><input id="cno" inputmode="numeric" placeholder="No urut"><input id="cnm" placeholder="Nama kandidat"></div><div class="row" style="margin-top:8px"><input id="cvs" placeholder="Visi singkat (opsional)"><button class="p" onclick="addCand()">Simpan</button></div></div>
  <div class="card"><h2>Kandidat (${cs.length})</h2>${cs.map(([id,c])=>`<div class="row" style="flex-wrap:nowrap;padding:6px 0"><span style="flex:1"><b>No ${esc(c.no)}</b> – ${esc(c.name)}</span><button class="d" onclick="delDoc('candidates','${esc(id)}')">Hapus</button></div>`).join('')||'<span class="mut">Belum ada.</span>'}</div>`;
}
function ctrlTab(){
  return `<div class="card"><h2>Kontrol pemilihan</h2><p class="mut">Pemilih hanya bisa masuk dan mengirim suara saat pemilihan dibuka.</p><div class="row"><button class="p" ${S.open?'disabled':''} onclick="setOpen(true)">Buka pemilihan</button><button ${S.open?'':'disabled'} onclick="setOpen(false)">Tutup pemilihan</button><button onclick="exportCsv()">Unduh rekap CSV</button></div></div>
  <div class="card"><h2>Reset</h2><p class="mut">Menghapus semua suara dan status memilih. Gunakan hanya untuk uji coba sebelum hari-H.</p><button class="d" onclick="resetAll()">${armed?'Klik lagi untuk konfirmasi reset':'Reset semua suara'}</button></div>`;
}

Object.assign(window,{doLogin,submitVote,adminLogin,logout,addVoter,bulkAdd,addCand,setOpen,delDoc,resetAll,exportCsv,tog,
  pick:id=>{V.sel=id;render(true)},cancelV:()=>{V={stage:'login'};render(true)},
  get view(){return view},set view(v){view=v},get tab(){return tab},set tab(v){tab=v},get q(){return q},set q(v){q=v},get note(){return note},set note(v){note=v},render});
</script>
</body>
</html>
