g.c1{grid-template-columns:1fr}.pg.c2{grid-template-columns:repeat(2,1fr)}.pg.c3{grid-template-columns:repeat(3,1fr)}@media(max-width:600px){.pg{grid-template-columns:1fr!important;max-width:none!important}}.fsbtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:5;min-height:36px;padding:6px 12px;font-size:.85rem;opacity:.9}body.fs .fsbtn{display:none}.c{text-align:center}.big{font-size:1.1rem}

.pres.show .pc.win .photo{max-height:30vh}.pres.show .has-win .pc:not(.win) .photo{max-height:19vh}.pres.show .pc:not(.win) .photo{max-height:24vh}
.pres.show .pc.win .pnum{font-size:clamp(2.8rem,6.5vw,4.6rem)}.pres.show .pc:not(.win) .pnum{font-size:clamp(1.8rem,4vw,2.6rem)}.pres.show .pc.win .big{font-size:1.3rem}

<body>
<div class="w"><div id="app"></div></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInAnonymously,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,updateDoc,deleteDoc,onSnapshot,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== ISI DENGAN KONFIGURASI FIREBASE ANDA (lihat README.md) ====== */
const CFG={
  apiKey:"AIzaSyD-6bziU2pvc7HKzN_enmqTFGr92N8mO90",
  authDomain:"pemilu-osis-spenaka.firebaseapp.com",
  projectId:"pemilu-osis-spenaka",
  storageBucket:"pemilu-osis-spenaka.firebasestorage.app",
  messagingSenderId:"727213622696",
  appId:"1:727213622696:web:cc4db7cecfba62f1d0499d"
};
/* ==================================================================== */

const MODE='admin'; // 'vote' = halaman pemilih, 'admin' = halaman admin
const DE=document.documentElement,fsOk=!!(DE.requestFullscreen||DE.webkitRequestFullscreen),isFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function goFull(){try{const r=(DE.requestFullscreen||DE.webkitRequestFullscreen).call(DE);if(r&&r.catch)r.catch(()=>{})}catch(x){}}
if(MODE==='vote'&&fsOk){
  const syncFs=()=>document.body.classList.toggle('fs',isFs());
  ['pointerdown','pointerup','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(!isFs())goFull()},true));
  document.addEventListener('fullscreenchange',syncFs);document.addEventListener('webkitfullscreenchange',syncFs);syncFs();
}
let hide=false,present=false,PH='ready',CNT=10,DUR=10,cdTimer=0,rv=false;try{hide=localStorage.getItem('osis_hide')==='1'}catch(e){}
const GROUPS=[];['7','8','9'].forEach(g=>'ABCDEFG'.split('').forEach(c=>GROUPS.push(g+c)));GROUPS.push('Guru','Karyawan');
const S={voters:{},candidates:{},votes:{},open:false,ready:false};
const CD={},COL=['#2457d6','#e08a00','#12a37f','#c0392b','#8e44ad','#16a2b8'];
let admin=false,view='vote',tab='live',V={stage:'login'},q='',armed=false,note='',fatal='',loginMsg='',unsubs=[],pub=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean=s=>String(s||'').trim().replace(/[^\w.-]/g,'');
const configured=!CFG.apiKey.startsWith('ISI');
let auth,db;

if(configured){
  const app=initializeApp(CFG);auth=getAuth(app);db=getFirestore(app);
  onAuthStateChanged(auth,async u=>{
    if(!u){admin=false;view='vote';stopAdmin();try{await signInAnonymously(auth)}catch(e){fatal='Gagal terhubung ke Firebase. Periksa konfigurasi dan pengaturan Authentication.';S.ready=true;render(true)}return}
    if(!pub){pub=true;
      onSnapshot(collection(db,'candidates'),s=>{const o={};s.forEach(x=>o[x.id]=x.data());S.candidates=o;render()},()=>{});
      onSnapshot(doc(db,'settings','election'),s=>{const x=s.data();S.open=!!(x&&x.open);render()},()=>{});
    }
    if(u.isAnonymous){admin=false;stopAdmin()}
    else if(MODE==='vote'){await signOut(auth);return}
    else{admin=true;startAdmin()}
    S.ready=true;render(true);
  });
}else{S.ready=true}
render(true);

function startAdmin(){
  if(unsubs.length)return;
  const bad=()=>{note='Akun ini bukan admin pemilihan.'; render(true)};
  unsubs=[
    onSnapshot(collection(db,'voters'),s=>{const o={};s.forEach(x=>o[x.id]=x.data());S.voters=o;render()},bad),
    onSnapshot(collection(db,'votes'),s=>{const o={};s.forEach(x=>o[x.id]=x.data());S.votes=o;render()},()=>{})
  ];
}
function stopAdmin(){unsubs.forEach(f=>f());unsubs=[];S.voters={};S.votes={}}

/* ---------- voter flow ---------- */
async function doLogin(){
  const id=clean($('nid').value);
  const m=t=>{V.msg=t;render(true)};
  if(!id)return m('Masukkan NISN / NIP / ID');
  if(!S.open)return m('Pemilihan belum dibuka atau sudah ditutup.');
  try{
    const s=await getDoc(doc(db,'voters',id));
    if(!s.exists())return m('Nomor tidak terdaftar. Silakan lapor ke panitia.');
    const v=s.data();
    if(v.voted)return m('Nomor ini sudah menggunakan hak pilih.');
    V={stage:'ballot',id,name:v.name,group:v.group,sel:null};render(true);
  }catch(e){m('Gagal memeriksa data. Periksa koneksi internet.')}
}
async function submitVote(){
  if(!V.sel||V.busy||!S.open)return;
  V.busy=true;render(true);
  try{
    const b=writeBatch(db);
    b.set(doc(collection(db,'votes')),{c:V.sel,t:Date.now()});
    b.update(doc(db,'voters',V.id),{voted:true,at:Date.now()});
    await b.commit();
    V={stage:'done'};render(true);setTimeout(()=>{V={stage:'login'};render(true)},6000);
  }catch(e){V.busy=false;V.msg='Suara gagal disimpan (mungkin nomor ini sudah memilih atau pemilihan ditutup). Hubungi panitia.';render(true)}
}

/* ---------- admin ---------- */
async function adminLogin(){
  try{await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value);view='admin';loginMsg=''}
  catch(e){loginMsg='Email atau password salah.'}render(true);
}
async function logout(){await signOut(auth)}
async function addVoter(){
  const id=clean($('vid').value),nm=$('vnm').value.trim(),g=$('vg').value,jk=$('vjk').value;
  if(!id||!nm){note='ID/NISN dan nama wajib diisi.';return render(true)}
  if(S.voters[id]){note='ID '+id+' sudah ada di daftar.';return render(true)}
  await setDoc(doc(db,'voters',id),{name:nm,group:g,voted:false,jk});note='Pemilih '+nm+' ditambahkan.';render(true);
}
const normGroup=g=>{let x=String(g||'').toUpperCase().replace(/KELAS|\s|-|\./g,'').replace(/^VIII/,'8').replace(/^VII/,'7').replace(/^IX/,'9');return GROUPS.find(k=>k.toUpperCase()===x)||String(g||'').trim()||'-'};
const normJk=v=>{const x=String(v||'').trim().toLowerCase();return /^(l|lk|laki|laki-laki|laki laki|pria|m|male)$/.test(x)?'L':/^(p|pr|perempuan|wanita|putri|f|female)$/.test(x)?'P':''};
async function importRows(rows){
  let n=0,skip=0,upd=0,b=writeBatch(db),c=0;const seen={};
  for(const r of rows){
    const id=clean(r[0]),nm=String(r[1]||'').trim(),jk=normJk(r[3]);
    if(!id||!nm||seen[id]){skip++;continue}
    seen[id]=1;const ex=S.voters[id];
    if(ex){if(jk&&ex.jk!==jk){b.update(doc(db,'voters',id),{jk});upd++;c++}else skip++}
    else{b.set(doc(db,'voters',id),{name:nm,group:normGroup(r[2]),voted:false,jk});n++;c++}
    if(c>=400){await b.commit();b=writeBatch(db);c=0}
  }
  if(c)await b.commit();
  note=n+' pemilih ditambahkan, '+upd+' data JK diperbarui, '+skip+' dilewati (duplikat/kosong).';render(true);
}
const ED={},F={k:'',s:'',j:'',o:'group',lim:80};
function resetF(){F.k='';F.s='';F.j='';F.o='group';F.lim=80;q='';render(true)}
const clearED=()=>Object.keys(ED).forEach(k=>delete ED[k]);
function editVoter(id){const v=S.voters[id];if(!v)return;clearED();Object.assign(ED,{id,nid:id,name:v.name||'',group:v.group||GROUPS[0],jk:v.jk||'',voted:!!v.voted});note='';render(true)}
function cancelED(){clearED();render(true)}
async function saveED(){
  const nid=clean(ED.nid),nm=(ED.name||'').trim();
  if(!nid||!nm){note='NISN/ID dan nama wajib diisi.';return render(true)}
  try{
    if(nid===ED.id){await updateDoc(doc(db,'voters',ED.id),{name:nm,group:ED.group,jk:ED.jk||''})}
    else{
      if(S.voters[nid]){note='ID '+nid+' sudah dipakai pemilih lain.';return render(true)}
      if(S.voters[ED.id]&&S.voters[ED.id].voted){note='ID pemilih yang sudah memilih tidak bisa diubah.';return render(true)}
      const b=writeBatch(db);
      b.set(doc(db,'voters',nid),{name:nm,group:ED.group,jk:ED.jk||'',voted:false});
      b.delete(doc(db,'voters',ED.id));
      await b.commit();
    }
    note='Data '+nm+' berhasil diperbarui.';clearED();
  }catch(e){note='Gagal menyimpan perubahan.'}
  render(true);
}
async function setJk(id,v){try{await updateDoc(doc(db,'voters',id),{jk:v})}catch(e){note='Gagal menyimpan JK.';render(true)}}
async function bulkAdd(){
  await importRows($('bulk').value.split('\n').map(l=>l.split(/[,;\t]/).map(x=>x.trim())))
}
async function importExcel(){
  const f=$('xf').files[0];
  if(!f){note='Pilih file Excel terlebih dahulu.';return render(true)}

const fx={raf:0,run:false};

const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function terbilang(n){
  const a=['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];n=Math.floor(n);
  if(n<12)return a[n];
  if(n<20)return terbilang(n-10)+' belas';
  if(n<100)return terbilang(Math.floor(n/10))+' puluh'+(n%10?' '+terbilang(n%10):'');
  if(n<200)return 'seratus'+(n>100?' '+terbilang(n-100):'');
  if(n<1000)return terbilang(Math.floor(n/100))+' ratus'+(n%100?' '+terbilang(n%100):'');
  if(n<2000)return 'seribu'+(n>1000?' '+terbilang(n-1000):'');
  if(n<1e6)return terbilang(Math.floor(n/1000))+' ribu'+(n%1000?' '+terbilang(n%1000):'');
  return String(n);
}

function exportRekap(){
  if(!window.XLSX){note='Pustaka Excel gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.';return render(true)}
  const R=recap(),wb=XLSX.utils.book_new(),add=(n,a)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),n);
  add('Ringkasan',[['REKAPITULASI HASIL PEMILIHAN KETUA OSIS DAN WAKIL KETUA OSIS'],['SMP Negeri 1 Kajoran'],['Dicetak pada',R.tgl],[],['Keterangan','Jumlah'],...R.sum]);
  add('Kandidat',[['No','Calon Ketua','Calon Wakil','Suara','% suara sah','Peringkat'],...R.cand.map(x=>[x.c.no,x.c.name,x.c.wakil||'',x.n,x.p,x.rank]),['','','Total suara sah',R.total,'','']]);
  add('Per Kelas',[['Kelas','Terdaftar','Menggunakan hak pilih','Tidak menggunakan','% partisipasi'],...R.grp.map(x=>[x.l,x.n,x.u,x.n-x.u,R.pct(x.u,x.n)]),['Total',R.dpt,R.used,R.unused,R.pct(R.used,R.dpt)]]);
  add('Per Kategori',[['Kategori','Terdaftar','Memilih','Belum memilih','% partisipasi'],...R.kat.map(x=>[x.l,x.n,x.u,x.n-x.u,R.pct(x.u,x.n)])]);
  add('Per Jam',[['Jam','Jumlah suara'],...R.hrs.map(h=>[h.l,h.n])]);
  XLSX.writeFile(wb,'rekap-pemilihan-osis.xlsx');
}
let LASTF=[];
const K={g:'',belum:false,tgl:'',id:'',ids:null};
function cardOf(id){K.id=id;K.ids=null;tab='kartu';note='';render(true);window.scrollTo({top:0,behavior:'smooth'})}
function cardsFromFilter(){K.ids=LASTF.slice();K.id='';tab='kartu';note='';render(true);window.scrollTo({top:0,behavior:'smooth'})}
function qrSvg(text){
  try{if(!window.qrcode)return '';const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:2,margin:4,scalable:true})}catch(e){return ''}
}
function cardHtml(id,v,tgl){
  const g=v.group,isG=g==='Guru',isK=g==='Karyawan',idl=isG?'NIP/ID':isK?'ID':'NISN',l2=(isG||isK)?'Status':'Kelas',qr=qrSvg('OSIS:'+id);
  return `<div class="vc"><div class="hd2"><img src="logo.png" alt="" onerror="this.remove()"><div class="ht"><b>KARTU PEMILIH</b><small>Pemilihan Ketua OSIS dan Wakil Ketua OSIS</small><small>SMP Negeri 1 Kajoran</small></div><img src="kpu-osis.png" alt="" onerror="this.remove()"></div>
  <div class="mid"><div class="bd"><span class="k">Nama</span><span class="v">${esc(v.name)}</span><span class="k">${l2}</span><span class="v">${esc(g)}</span><span class="k">${idl}</span><span class="v id">${esc(id)}</span>${tgl?`<span class="k">Tanggal</span><span class="v">${esc(tgl)}</span>`:''}</div>${qr?`<div class="qr">${qr}</div>`:''}</div>
  <div class="ft">Pindai QR di tablet bilik suara atau ketik nomor di atas. Kartu hanya berlaku untuk satu kali pemilihan.</div></div>`;
}
function kartuTab(){
  const tx=x=>String(x==null?'':x),gi=g=>{const k=GROUPS.indexOf(g);return k<0?999:k},isStaff=v=>v.group==='Guru'||v.group==='Karyawan';
  let a=Object.entries(S.voters);
  if(K.id)a=a.filter(([id])=>id===K.id);
  else if(K.ids){const st=new Set(K.ids);a=a.filter(([id])=>st.has(id))}
  else{if(K.g==='__siswa')a=a.filter(([,v])=>!isStaff(v));else if(K.g)a=a.filter(([,v])=>v.group===K.g);if(K.belum)a=a.filter(([,v])=>!v.voted)}
  a.sort((x,y)=>gi(x[1].group)-gi(y[1].group)||tx(x[1].name).localeCompare(tx(y[1].name),'id'));
  const all=Object.values(S.voters),cnt={};all.forEach(v=>{cnt[v.group]=(cnt[v.group]||0)+1});
  const opts=[['','Semua pemilih ('+all.length+')'],['__siswa','Semua siswa ('+all.filter(v=>!isStaff(v)).length+')'],...GROUPS.map(g=>[g,g+' ('+(cnt[g]||0)+')'])].map(([v,t])=>`<option value="${esc(v)}" ${K.g===v?'selected':''}>${esc(t)}</option>`).join('');
  const mode=K.id?`Kartu individual: <b>${esc((S.voters[K.id]||{}).name||K.id)}</b>`:K.ids?`Daftar dari filter di menu Pemilih (${a.length} orang)`:'';
  return `<div class="rptwrap"><div class="card noprint"><h2>Cetak kartu pemilih</h2>
  ${mode?`<p>${mode} <button onclick="K.id='';K.ids=null;render(true)">Pilih per kategori</button></p>`:`<div class="row"><select onchange="K.g=this.value;render(true)">${opts}</select><label style="flex:0 0 auto;display:flex;gap:6px;align-items:center"><input type="checkbox" style="width:auto" ${K.belum?'checked':''} onchange="K.belum=this.checked;render(true)">Hanya yang belum memilih</label></div>`}
  <div class="row" style="margin-top:10px"><input placeholder="Tanggal pemilihan (opsional, tampil di kartu)" value="${esc(K.tgl)}" onchange="K.tgl=this.value;render(true)"><button class="p" onclick="window.print()" ${a.length?'':'disabled'}>Cetak ${a.length} kartu</button></div>
  ${window.qrcode?'':'<p class="err">Pustaka kode QR gagal dimuat (periksa koneksi internet lalu muat ulang). Kartu akan tercetak tanpa QR.</p>'}<p class="mut" style="margin:10px 0 0">Ukuran kartu 90 × 58 mm, 8 kartu per lembar A4 (2 kolom × 4 baris). Di jendela cetak pilih kertas A4 dan skala 100%. Garis putus-putus adalah panduan potong.</p></div>
  <div class="cards">${a.map(([id,v])=>cardHtml(id,v,K.tgl)).join('')||'<p class="mut">Tidak ada pemilih pada pilihan ini.</p>'}</div></div>`;
}
function ctrlTab(){
  return `<div class="card"><h2>Kontrol pemilihan</h2><p class="mut">Pemilih hanya bisa masuk dan mengirim suara saat pemilihan dibuka.</p><div class="row"><button class="p" ${S.open?'disabled':''} onclick="setOpen(true)">Buka pemilihan</button><button ${S.open?'':'disabled'} onclick="setOpen(false)">Tutup pemilihan</button></div><p class="mut" style="margin:12px 0 0">Setelah pemilihan ditutup, buka tab <b>Rekap</b> untuk mencetak hasil atau mengunduhnya dalam bentuk Excel.</p></div>
  <div class="card"><h2>Reset</h2><p class="mut">Menghapus semua suara dan status memilih. Gunakan hanya untuk uji coba sebelum hari-H.</p><button class="d" onclick="resetAll()">${armed?'Klik lagi untuk konfirmasi reset':'Reset semua suara'}</button></div>`;
}
