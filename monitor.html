<html lang="id">
<head>

<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mut:#667089;--pri:#2457d6;--prt:#fff;--ok:#12805c;--err:#c0392b;--bd:#dde2ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#10141d;--card:#1a2030;--tx:#e8ecf6;--mut:#97a1ba;--pri:#6b94ff;--prt:#0b1020;--ok:#3ccf9b;--err:#ff7a6b;--bd:#2c3550;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:960px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:1.25rem;margin:0}h2{font-size:1.1rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.8rem;border:1px solid var(--bd);color:var(--mut)}
.chip.on{color:var(--ok);border-color:var(--ok)}.chip.off{color:var(--err);border-color:var(--err)}

button.p{background:var(--pri);color:var(--prt);border-color:var(--pri);font-weight:600}
button.d{color:var(--err)}button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row>*{flex:1 1 140px}.row>button{flex:0 0 auto}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}.tabs button{flex:0 0 auto}.tabs .a{background:var(--pri);color:var(--prt);border-color:var(--pri)}

.no{font-size:2.4rem;font-weight:800;color:var(--pri);line-height:1}

.bar{height:22px;border-radius:8px;background:var(--bg);border:1px solid var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}

.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.92rem}td,th{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left}
.photo{display:block;width:100%;height:auto;max-height:52vh;object-fit:contain;border-radius:10px;margin-bottom:10px;background:var(--bg)}.photo.ph{min-height:180px;max-height:none}.thumb{width:76px;height:76px;object-fit:cover;border-radius:10px;flex:0 0 auto;background:var(--bg)}.ph{display:flex;align-items:center;justify-content:center;color:var(--mut);font-weight:700;border:1px dashed var(--bd)}.cl{display:flex;gap:14px;align-items:center}.lg{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;font-size:.88rem}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}.two .card{margin:0;display:flex;flex-direction:column}.lst{display:flex;flex-direction:column;justify-content:space-around;gap:14px;flex:1}.vn{text-align:right;flex:0 0 auto}.vn b{display:block;font-size:2rem;line-height:1}.chip.sr{color:#e08a00;border-color:#e08a00}.pm .w{max-width:1200px}.pres{min-height:92vh;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center}.pres .photo{max-height:34vh}.pc{text-align:center;margin:0}.pnum{font-size:clamp(2.6rem,7vw,5rem);font-weight:800;line-height:1}.xbtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:5;min-height:36px;padding:6px 12px;font-size:.85rem;opacity:.7}@media(max-width:760px){.two{grid-template-columns:1fr}}.hd{flex-direction:column;justify-content:center;text-align:center;gap:6px;margin-bottom:20px}.hd h1{font-size:1.6rem;text-wrap:balance}.logos{display:flex;justify-content:center;align-items:center;gap:22px}.logo{height:92px;width:auto;max-width:44%;object-fit:contain}.sch{color:var(--mut);font-size:1.05rem;font-weight:600;letter-spacing:.02em}.vm .w{max-width:680px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center}.vm.ballot .w{max-width:960px}.lc{text-align:center}.pg{display:grid;gap:14px;margin:0 auto;width:100%}.pg.c1{grid-template-columns:1fr}.pg.c2{grid-template-columns:repeat(2,1fr)}.pg.c3{grid-template-columns:repeat(3,1fr)}@media(max-width:600px){.pg{grid-template-columns:1fr!important;max-width:none!important}}.fsbtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:5;min-height:36px;padding:6px 12px;font-size:.85rem;opacity:.9}body.fs .fsbtn{display:none}.mm .w{max-width:1300px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center}.mon{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}.mc{flex:0 1 230px;min-width:170px;text-align:center;margin:0;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;padding:22px 12px}.mn{font-size:clamp(1.1rem,2vw,1.7rem);font-weight:800;line-height:1.2;word-break:break-word}.c{text-align:center}.big{font-size:1.1rem}
.lc #nid{font-size:1.6rem;text-align:center;letter-spacing:.1em;font-weight:700}
@media (pointer:coarse){
.typing .hd .logos,.typing .hd .sch,.typing .hd>div:last-child{display:none}.typing .hd{margin-bottom:8px;gap:2px}.typing .hd h1{font-size:1.1rem}
.vm.typing .w{justify-content:flex-start;min-height:0;padding-top:10px}
}

<body>
<div class="w"><div id="app"></div></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInAnonymously,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,updateDoc,deleteDoc,onSnapshot,writeBatch,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== ISI DENGAN KONFIGURASI FIREBASE ANDA (lihat README.md) ====== */
const CFG={
  apiKey:"AIzaSyD-6bziU2pvc7HKzN_enmqTFGr92N8mO90",
  authDomain:"pemilu-osis-spenaka.firebaseapp.com",
  projectId:"pemilu-osis-spenaka",
  storageBucket:"pemilu-osis-spenaka.firebasestorage.app",
  messagingSenderId:"727213622696",
  appId:"1:727213622696:web:cc4db7cecfba62f1d0499d"
};
/* ==================================================================== */

const MODE='monitor'; // 'vote' = halaman pemilih, 'admin' = halaman admin
const DE=document.documentElement,fsOk=!!(DE.requestFullscreen||DE.webkitRequestFullscreen),isFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function goFull(){try{const r=(DE.requestFullscreen||DE.webkitRequestFullscreen).call(DE);if(r&&r.catch)r.catch(()=>{})}catch(x){}}
if((MODE==='vote'||MODE==='monitor')&&fsOk){
  const syncFs=()=>document.body.classList.toggle('fs',isFs());
  if(MODE==='vote')['pointerdown','pointerup','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(!isFs())goFull()},true));
  document.addEventListener('fullscreenchange',syncFs);document.addEventListener('webkitfullscreenchange',syncFs);syncFs();
}
let hide=false,present=false;try{hide=localStorage.getItem('osis_hide')==='1'}catch(e){}
const KAT={putra:{t:'Siswa Laki-laki',c:'#2f6fe4'},putri:{t:'Siswa Perempuan',c:'#d6458a'},guru:{t:'Guru',c:'#12a37f'},karyawan:{t:'Karyawan',c:'#e08a00'},siswa:{t:'Siswa',c:'#7a86a6'}};
const katOf=(g,jk)=>g==='Guru'?'guru':g==='Karyawan'?'karyawan':jk==='P'?'putri':jk==='L'?'putra':'siswa';
const scan={on:false,stream:null,t:0,to:0,facing:'user',last:'',lastT:0,hint:''};
if(MODE==='vote'){
  /* sentuh di luar kolom isian / tombol -> logo & judul tampil lagi */
  document.addEventListener('pointerdown',e=>{
    if(!document.body.classList.contains('typing'))return;
    if(e.target&&e.target.closest&&e.target.closest('#nid,.lc button'))return;
    document.body.classList.remove('typing');
    const a=document.activeElement;if(a&&a.id==='nid')a.blur();
  },true);
  /* papan ketik ditutup (tombol kembali) -> logo & judul tampil lagi */
  if(window.visualViewport){
    let vb=visualViewport.height,kbOpen=false;
    visualViewport.addEventListener('resize',()=>{
      const h=visualViewport.height,a=document.activeElement;
      vb=Math.max(vb,h);
      if(h<vb*0.8)kbOpen=true;
      else if(kbOpen&&h>vb*0.9){kbOpen=false;document.body.classList.remove('typing')}
      if(a&&a.id==='nid')setTimeout(()=>{a.scrollIntoView&&a.scrollIntoView({block:'center',behavior:'smooth'})},150);
    });
  }
}
const GROUPS=[];['7','8','9'].forEach(g=>'ABCDEFG'.split('').forEach(c=>GROUPS.push(g+c)));GROUPS.push('Guru','Karyawan');
const S={voters:{},candidates:{},votes:{},active:{},open:false,ready:false};
const CD={},COL=['#2457d6','#e08a00','#12a37f','#c0392b','#8e44ad','#16a2b8'];
let admin=false,view='vote',tab='live',V={stage:'login'},q='',armed=false,note='',fatal='',loginMsg='',unsubs=[],pub=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean=s=>String(s||'').trim().replace(/[^\w.-]/g,'');
const configured=!CFG.apiKey.startsWith('ISI');
let auth,db;
/* ---- penanda bilik: siapa yang sedang memilih ---- */
const BILIK=(new URLSearchParams(location.search).get('bilik')||'').replace(/[^\w-]/g,'').slice(0,10);
let STN=BILIK?'b'+BILIK:null;
if(!STN){try{STN=localStorage.getItem('osis_stn')}catch(e){}if(!STN){STN='d'+Math.random().toString(36).slice(2,9);try{localStorage.setItem('osis_stn',STN)}catch(e){}}}
let hb=null,PA=null,pq=Promise.resolve();
const first=()=>setDoc(doc(db,'active',STN),{name:PA.name,group:PA.group,bilik:BILIK,kat:PA.kat,s:serverTimestamp(),t:serverTimestamp()});
const beat=()=>updateDoc(doc(db,'active',STN),{t:serverTimestamp()});
async function pres(on){
  if(MODE!=='vote'||!db)return;
  clearInterval(hb);hb=null;
  if(on){await first();hb=setInterval(()=>{beat().catch(()=>{})},30000)}
  else{PA=null;await deleteDoc(doc(db,'active',STN))}
}
const presence=on=>{pq=pq.then(()=>pres(on)).catch(()=>{})};

if(configured){
  const app=initializeApp(CFG);auth=getAuth(app);db=getFirestore(app);
  onAuthStateChanged(auth,async u=>{
    if(!u){admin=false;view='vote';stopAdmin();try{await signInAnonymously(auth)}catch(e){fatal='Gagal terhubung ke Firebase. Periksa konfigurasi dan pengaturan Authentication.';S.ready=true;render(true)}return}
    if(!pub){pub=true;
      if(MODE==='vote')presence(false);
      if(MODE==='monitor')onSnapshot(collection(db,'active'),s=>{const o={};s.forEach(x=>o[x.id]=x.data());S.active=o;render(true)},()=>{});
      onSnapshot(collection(db,'candidates'),s=>{const o={};s.forEach(x=>o[x.id]=x.data());S.candidates=o;render()},()=>{});
      onSnapshot(doc(db,'settings','election'),s=>{const x=s.data();S.open=!!(x&&x.open);if(MODE==='vote'&&!S.open&&V.stage==='ballot'){V={stage:'login',msg:'Pemilihan telah ditutup oleh panitia.'};presence(false)}render(true)},()=>{});
    }
    if(u.isAnonymous){admin=false;stopAdmin()}
    else if(MODE==='vote'||MODE==='monitor'){await signOut(auth);return}
    else{admin=true;startAdmin()}
    S.ready=true;render(true);
  });
}else{S.ready=true}
render(true);

function startAdmin(){
  if(unsubs.length)return;
  const bad=()=>{note='Akun ini bukan admin pemilihan.'; render(true)};
  unsubs=[
    onSnapshot(collection(db,'voters'),s=>{const o={};s.forEach(x=>o[x.id]=x.data());S.voters=o;render()},bad),
    onSnapshot(collection(db,'votes'),s=>{const o={};s.forEach(x=>o[x.id]=x.data());S.votes=o;render()},()=>{})
  ];
}
function stopAdmin(){unsubs.forEach(f=>f());unsubs=[];S.voters={};S.votes={}}

/* ---------- voter flow ---------- */
async function doLogin(idArg){
  const id=clean(typeof idArg==='string'?idArg:$('nid').value);
  const m=t=>{V.msg=t;render(true)};
  if(!id)return m('Masukkan NISN / NIP / ID');
  if(!S.open)return m('Pemilihan belum dibuka atau sudah ditutup.');
  try{
    const s=await getDoc(doc(db,'voters',id));
    if(!s.exists())return m('Nomor tidak terdaftar. Silakan lapor ke panitia.');
    const v=s.data();
    if(v.voted)return m('Nomor ini sudah menggunakan hak pilih.');
    V={stage:'ballot',id,name:v.name,group:v.group,sel:null};PA={name:v.name||'',group:v.group||'',kat:katOf(v.group,v.jk)};presence(true);render(true);
  }catch(e){m('Gagal memeriksa data. Periksa koneksi internet.')}
}
/* ---------- pindai QR kartu pemilih ---------- */
const stopStream=()=>{if(scan.stream){scan.stream.getTracks().forEach(t=>t.stop());scan.stream=null}};
function stopScan(){scan.on=false;clearTimeout(scan.t);clearTimeout(scan.to);stopStream()}
async function openCam(){
  stopStream();
  const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:scan.facing,width:{ideal:1280},height:{ideal:720}},audio:false});
  const vd=$('qv');if(!vd||!scan.on){st.getTracks().forEach(t=>t.stop());return}
  scan.stream=st;vd.srcObject=st;await vd.play();
}
async function startScan(){
  V.msg='';scan.hint='';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){V.msg='Kamera tidak didukung di browser ini. Ketik NISN secara manual.';return render(true)}
  scan.on=true;render(true);
  clearTimeout(scan.to);scan.to=setTimeout(()=>{if(scan.on){stopScan();V.msg='Pemindaian dihentikan karena tidak ada kartu yang terbaca.';render(true)}},60000);
  try{await openCam();tick()}catch(e){stopScan();V.msg='Kamera tidak bisa dibuka. Izinkan akses kamera di browser, atau ketik NISN secara manual.';render(true)}
}
async function flipCam(){
  scan.facing=scan.facing==='user'?'environment':'user';
  const vd=$('qv');if(vd)vd.style.transform=scan.facing==='user'?'scaleX(-1)':'none';
  try{await openCam()}catch(e){}
}
function cancelScan(){stopScan();render(true)}
const detector=('BarcodeDetector' in window)?(()=>{try{return new BarcodeDetector({formats:['qr_code']})}catch(e){return null}})():null;
const cvs=document.createElement('canvas');
async function tick(){
  if(!scan.on)return;
  const vd=$('qv');let txt='';
  if(vd&&vd.readyState>=2&&vd.videoWidth){
    try{
      if(detector){const r=await detector.detect(vd);if(r.length)txt=r[0].rawValue||''}
      else if(window.jsQR){
        const k=Math.min(1,640/vd.videoWidth);cvs.width=Math.round(vd.videoWidth*k);cvs.height=Math.round(vd.videoHeight*k);
        const cx=cvs.getContext('2d',{willReadFrequently:true});cx.drawImage(vd,0,0,cvs.width,cvs.height);
        const im=cx.getImageData(0,0,cvs.width,cvs.height),r=jsQR(im.data,im.width,im.height,{inversionAttempts:'dontInvert'});if(r)txt=r.data;
      }
    }catch(e){}
  }
  if(txt&&await onQR(txt))return;
  scan.t=setTimeout(tick,detector?150:220);
}
async function onQR(txt){
  const now=Date.now();
  if(txt===scan.last&&now-scan.lastT<2500)return false;
  scan.last=txt;scan.lastT=now;
  if(!/^OSIS:/.test(txt)){scan.hint='QR ini bukan kartu pemilih OSIS.';const e=$('qh');if(e)e.textContent=scan.hint;return false}
  const id=clean(txt.slice(5));if(!id)return false;
  stopScan();await doLogin(id);return true;
}
async function submitVote(){
  if(!V.sel||V.busy||!S.open)return;
  V.busy=true;render(true);
  try{
    const b=writeBatch(db);
    b.set(doc(collection(db,'votes')),{c:V.sel,t:Date.now()});
    b.update(doc(db,'voters',V.id),{voted:true,at:Date.now()});
    await b.commit();
    V={stage:'done'};render(true);setTimeout(()=>{V={stage:'login'};render(true);presence(false)},6000);
  }catch(e){
    console.error('Gagal menyimpan suara:',e);
    let why='';
    try{const v=await getDoc(doc(db,'voters',V.id));if(v.exists()&&v.data().voted)why='Nomor ini sudah tercatat memilih.'}catch(x){}
    if(!why)why=!S.open?'Pemilihan sudah ditutup oleh panitia.':e&&e.code==='permission-denied'?'Ditolak oleh aturan keamanan database (Rules).':e&&e.code==='unavailable'?'Koneksi internet bermasalah.':'Suara belum tersimpan.';
    V.busy=false;V.msg=why+' Hubungi panitia. (kode: '+(e&&e.code||'tidak diketahui')+')';render(true)}
}

/* ---------- admin ---------- */
async function adminLogin(){
  try{await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value);view='admin';loginMsg=''}
  catch(e){loginMsg='Email atau password salah.'}render(true);
}
async function logout(){await signOut(auth)}
async function addVoter(){
  const id=clean($('vid').value),nm=$('vnm').value.trim(),g=$('vg').value,jk=$('vjk').value;
  if(!id||!nm){note='ID/NISN dan nama wajib diisi.';return render(true)}
  if(S.voters[id]){note='ID '+id+' sudah ada di daftar.';return render(true)}
  await setDoc(doc(db,'voters',id),{name:nm,group:g,voted:false,jk});note='Pemilih '+nm+' ditambahkan.';render(true);
}
const normGroup=g=>{let x=String(g||'').toUpperCase().replace(/KELAS|\s|-|\./g,'').replace(/^VIII/,'8').replace(/^VII/,'7').replace(/^IX/,'9');return GROUPS.find(k=>k.toUpperCase()===x)||String(g||'').trim()||'-'};
const normJk=v=>{const x=String(v||'').trim().toLowerCase();return /^(l|lk|laki|laki-laki|laki laki|pria|m|male)$/.test(x)?'L':/^(p|pr|perempuan|wanita|putri|f|female)$/.test(x)?'P':''};
async function importRows(rows){
  let n=0,skip=0,upd=0,b=writeBatch(db),c=0;const seen={};
  for(const r of rows){
    const id=clean(r[0]),nm=String(r[1]||'').trim(),jk=normJk(r[3]);
    if(!id||!nm||seen[id]){skip++;continue}
    seen[id]=1;const ex=S.voters[id];
    if(ex){if(jk&&ex.jk!==jk){b.update(doc(db,'voters',id),{jk});upd++;c++}else skip++}
    else{b.set(doc(db,'voters',id),{name:nm,group:normGroup(r[2]),voted:false,jk});n++;c++}
    if(c>=400){await b.commit();b=writeBatch(db);c=0}
  }
  if(c)await b.commit();
  note=n+' pemilih ditambahkan, '+upd+' data JK diperbarui, '+skip+' dilewati (duplikat/kosong).';render(true);
}
async function setJk(id,v){try{await updateDoc(doc(db,'voters',id),{jk:v})}catch(e){note='Gagal menyimpan JK.';render(true)}}
async function bulkAdd(){
  await importRows($('bulk').value.split('\n').map(l=>l.split(/[,;\t]/).map(x=>x.trim())))
}
async function importExcel(){
  const f=$('xf').files[0];
  if(!f){note='Pilih file Excel terlebih dahulu.';return render(true)}
  if(!window.XLSX){note='Pustaka Excel gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.';return render(true)}
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    let rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''}).map(r=>r.map(x=>String(x).trim())).filter(r=>r.some(x=>x));
    let ci=0,ni=1,gi=2,ji=3;const h=rows[0]||[],fi=re=>h.findIndex(x=>re.test(x));
    if(h.some(x=>/nisn|nip|nama/i.test(x))){
      const a=fi(/nisn|nip|^id$|nomor/i),b=fi(/nama/i),c=fi(/kelas|rombel|kelompok/i),d=fi(/^jk$|jenis|kelamin|gender|^l\/p$/i);
      if(a>=0)ci=a;if(b>=0)ni=b;if(c>=0)gi=c;if(d>=0)ji=d;rows=rows.slice(1);
    }

function pickPhoto(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();
    im.onload=()=>{const m=720,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      CD.photo=c.toDataURL('image/jpeg',0.8);render(true)};
    im.onerror=()=>{note='File gambar tidak bisa dibaca.';render(true)};im.src=r.result};
  r.readAsDataURL(f);
}

function bars(cs,t){
  if(!cs.length)return '<p class="mut">Belum ada kandidat.</p>';
  const W=420,H=300,L=34,R=10,T=28,B=34,n=cs.length,total=Object.keys(S.votes).length,mx=Math.max(1,...cs.map(([id])=>t[id]||0)),st=Math.ceil(mx/5),top=st*Math.ceil(mx/st);

  for(let v=0;v<=top;v+=st)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--bd)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" style="fill:var(--mut)">${v}</text>`;
  const bar=cs.map(([id,c],i)=>{const v=t[id]||0,x=L+sl*i+(sl-bw)/2,y=Y(v);
    return `<rect x="${x}" y="${y}" width="${bw}" height="${H-B-y}" rx="6" fill="${COL[i%6]}"/><text x="${x+bw/2}" y="${y-15}" text-anchor="middle" font-size="14" font-weight="700" style="fill:var(--tx)">${v}</text><text x="${x+bw/2}" y="${y-3}" text-anchor="middle" font-size="11" style="fill:var(--mut)">${total?Math.round(v/total*100):0}%</text><text x="${x+bw/2}" y="${H-12}" text-anchor="middle" font-size="12" style="fill:var(--tx)">No ${esc(c.no)}</text>`}).join('');

  <div style="margin-top:8px"><input placeholder="Visi singkat (opsional)" value="${esc(CD.vision)}" oninput="CD.vision=this.value"></div>
  <div class="cl" style="margin-top:10px">${CD.photo?`<img class="thumb" src="${esc(CD.photo)}" alt="">`:'<div class="thumb ph">Foto</div>'}<div style="flex:1"><div class="mut" style="margin-bottom:4px">Foto paslon (JPG/PNG, otomatis diperkecil)</div><input type="file" accept="image/*" onchange="pickPhoto(this)"></div></div>
  <div class="row" style="margin-top:12px"><button class="p" onclick="addCand()">Simpan paslon</button>${CD.id||CD.no||CD.name?'<button onclick="cancelCD()">Batal / kosongkan</button>':''}</div></div>
  <div class="card"><h2>Daftar paslon (${cs.length})</h2>${cs.map(([id,c])=>`<div class="cl" style="padding:8px 0;border-bottom:1px solid var(--bd)">${img(c,'thumb')}<div style="flex:1;min-width:0"><b>No ${esc(c.no)}</b><div>Ketua: ${esc(c.name)}</div><div>Wakil: ${esc(c.wakil||'-')}</div></div><button onclick="editCand('${esc(id)}')">Ubah</button><button class="d" onclick="delDoc('candidates','${esc(id)}')">Hapus</button></div>`).join('')||'<span class="mut">Belum ada paslon.</span>'}</div>`;
}
function ctrlTab(){
  return `<div class="card"><h2>Kontrol pemilihan</h2><p class="mut">Pemilih hanya bisa masuk dan mengirim suara saat pemilihan dibuka.</p><div class="row"><button class="p" ${S.open?'disabled':''} onclick="setOpen(true)">Buka pemilihan</button><button ${S.open?'':'disabled'} onclick="setOpen(false)">Tutup pemilihan</button><button onclick="exportCsv()">Unduh rekap CSV</button></div></div>
  <div class="card"><h2>Reset</h2><p class="mut">Menghapus semua suara dan status memilih. Gunakan hanya untuk uji coba sebelum hari-H.</p><button class="d" onclick="resetAll()">${armed?'Klik lagi untuk konfirmasi reset':'Reset semua suara'}</button></div>`;
}

Object.assign(window,{doLogin,submitVote,adminLogin,logout,addVoter,bulkAdd,addCand,setOpen,delDoc,resetAll,exportCsv,tog,render,setJk,goFull,startScan,flipCam,cancelScan,toggleHide,startPresent,stopPresent,CD,importExcel,template,pickPhoto,editCand,cancelCD,
  pick:id=>{V.sel=id;render(true)},cancelV:()=>{V={stage:'login'};render(true);presence(false)}});
Object.defineProperties(window,{
  view:{get:()=>view,set:v=>{view=v},configurable:true},
  tab:{get:()=>tab,set:v=>{tab=v},configurable:true},
  q:{get:()=>q,set:v=>{q=v},configurable:true},
  note:{get:()=>note,set:v=>{note=v},configurable:true}
});
</script>
